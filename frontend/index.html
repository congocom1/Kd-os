<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020202">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>KD // BIOMETRIC ACCESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:        #ffaa00;
    --amber-bright: #ffe0a0;
    --amber-hot:    #fff2cf;
    --amber-dim:    #6b4400;
    --amber-glass:  rgba(255,170,0,0.08);
    --panel-bg:     rgba(7,8,5,0.82);
    --red:          #ff3b30;
    --green:        #35ff8a;
    --text-dim:     #8a6a2a;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  button, input{ font:inherit; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--amber-bright); outline-offset:3px; }
  button:disabled{ cursor:not-allowed; opacity:0.55; }

  html,body{
    width:100%; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 45%, #0b0906 0%, #050403 45%, #000000 100%);
    font-family:'Share Tech Mono', monospace;
    color: var(--amber);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ambient moving grid backdrop (pure CSS, cheap) ---------- */
  #grid{
    position:fixed; inset:-2px; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,170,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,170,0,0.05) 1px, transparent 1px);
    background-size: 46px 46px;
    animation: gridDrift 22s linear infinite;
    opacity:0.5;
  }
  @keyframes gridDrift{ from{ background-position:0 0, 0 0; } to{ background-position:0 460px, 460px 0; } }
  #vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 40%, #000 100%);
  }

  .bracket{ position:fixed; width:46px; height:46px; border:1.5px solid var(--amber); opacity:0.45; z-index:5; }
  .bracket.tl{ top:18px; left:18px; border-right:none; border-bottom:none; }
  .bracket.tr{ top:18px; right:18px; border-left:none; border-bottom:none; }
  .bracket.bl{ bottom:18px; left:18px; border-right:none; border-top:none; }
  .bracket.br{ bottom:18px; right:18px; border-left:none; border-top:none; }

  #header{
    position:fixed; top:0; left:0; right:0; z-index:5;
    text-align:center; padding:26px 20px 0 20px;
    letter-spacing:6px;
  }
  #header h1{
    font-family:'Orbitron', sans-serif; font-weight:900; font-size:22px;
    color:var(--amber-bright); text-shadow:0 0 14px rgba(255,180,60,0.6);
  }
  #header p{ margin-top:6px; font-size:10px; letter-spacing:3px; color:var(--text-dim); }

  /* ---------- main stage ---------- */
  #stage{
    position:relative; z-index:2;
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
  }

  #scanFrame{
    position:relative; width:380px; height:380px;
    border:1px solid var(--amber-dim);
    background:#050402;
    overflow:hidden;
  }
  #scanFrame::before, #scanFrame::after{
    content:''; position:absolute; width:26px; height:26px; border:2px solid var(--amber);
    opacity:0.8;
  }
  #scanFrame::before{ top:8px; left:8px; border-right:none; border-bottom:none; }
  #scanFrame::after{ bottom:8px; right:8px; border-left:none; border-top:none; }

  #video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); background:#000; }

  #scanLine{
    position:absolute; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--amber-bright), transparent);
    box-shadow: 0 0 8px var(--amber), 0 0 16px var(--amber);
    opacity:0.9; top:0;
    animation: scanMove 2.2s linear infinite;
  }
  @keyframes scanMove{ from{ top:0; } to{ top:100%; } }

  #status{
    text-align:center; min-height:42px;
    font-family:'Orbitron', sans-serif; font-weight:700; font-size:14px;
    letter-spacing:2px; color:var(--amber-bright);
    text-shadow:0 0 10px rgba(255,180,60,0.5);
  }

  .panel{
    background:var(--panel-bg);
    border:1px solid var(--amber-dim);
    padding:18px 22px;
    width:100%; max-width:380px;
    font-size:11px; line-height:1.6;
    color:var(--text-dim);
  }
  .panel h3{ color:var(--amber-bright); margin-bottom:10px; font-family:'Orbitron',sans-serif; font-size:12px; letter-spacing:1px; }
  .panel .row{ display:flex; justify-content:space-between; margin:6px 0; }
  .panel .label{ color:var(--text-dim); }
  .panel .value{ color:var(--amber); font-family:'Orbitron',sans-serif; }

  .btn-row{ display:flex; gap:12px; margin-top:18px; }
  .btn{
    flex:1; padding:12px 0; border:1px solid var(--amber-dim);
    background:#070603; color:var(--amber); font-family:'Orbitron',sans-serif;
    font-size:12px; letter-spacing:1px; cursor:pointer; transition:background .15s, border-color .15s;
  }
  .btn:hover:not(:disabled){ background:var(--amber-glass); border-color:var(--amber); }
  .btn.primary{ border-color:var(--amber); color:#050402; background:var(--amber); }
  .btn.primary:hover:not(:disabled){ background:var(--amber-bright); }
  .btn.danger{ border-color:var(--red); color:var(--red); }
  .btn.danger:hover:not(:disabled){ background:rgba(255,59,48,0.12); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .link-row{ display:flex; justify-content:center; gap:22px; margin-top:14px; font-size:10px; }
  .link{ color:var(--text-dim); text-decoration:none; letter-spacing:1px; }
  .link:hover{ color:var(--amber); }

  @media (max-width:420px){
    #scanFrame{ width:300px; height:300px; }
    .panel{ padding:14px 16px; }
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="vignette"></div>
<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>

<header id="header">
  <h1>KD</h1>
  <p>COGNITIVE AUTONOMOUS OS</p>
</header>

<main id="stage">
  <div id="scanFrame">
    <video id="video" autoplay muted playsinline aria-hidden="true"></video>
    <div id="scanLine"></div>
  </div>

  <div id="status">INITIALIZING…</div>

  <section class="panel" aria-label="System status">
    <h3>SYSTEM STATUS</h3>
    <div class="row"><span class="label">CORE</span><span class="value" id="sysCore">—</span></div>
    <div class="row"><span class="label">GPU</span><span class="value" id="sysGpu">—</span></div>
    <div class="row"><span class="label">MEMORY</span><span class="value" id="sysMem">—</span></div>
    <div class="row"><span class="label">OLLAMA</span><span class="value" id="sysOllama">—</span></div>
  </section>

  <div class="btn-row">
    <button class="btn primary" id="beginEnrollBtn" disabled>BEGIN ENROLLMENT SCAN</button>
    <button class="btn" id="guestLink">CONTINUE AS GUEST</button>
  </div>

  <div class="link-row">
    <a class="link" id="resetLink" href="#">RESET ALL PROFILES</a>
  </div>
</main>

<script type="module" src="/src/biometric.js"></script>
</body>
</html>
