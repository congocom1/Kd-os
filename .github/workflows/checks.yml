name: KD checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libportaudio2
      - run: ./kd doctor
      - run: python -m pip install -r requirements-dev.txt
      - run: ./kd check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build -- --outDir "$RUNNER_TEMP/kd-dashboard"
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run check:boundaries --workspace=apps/gods-eye-view
      - name: Globe build and launch regressions
        working-directory: apps/gods-eye-view
        run: node --test src/tooling/allowedHosts.test.mjs src/tooling/applicationHtml.test.mjs src/tooling/panelBuild.test.mjs src/tooling/viteBuild.test.mjs src/dockerLauncher.test.mjs
      - run: npm run build:gev -- --outDir "$RUNNER_TEMP/kd-gev"
      - run: test -s "$RUNNER_TEMP/kd-gev/cesium/Cesium.js"
